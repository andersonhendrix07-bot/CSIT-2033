name: hostguard

on:
  push:
    paths: ["hostguard/**", ".github/workflows/hostguard.yml"]
  pull_request:
    paths: ["hostguard/**", ".github/workflows/hostguard.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the primary target (the user's PC is Windows 11 Home, Python 3.13).
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: hostguard
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Same hash-checked install path the README gives Windows users.
      - name: Install (hash-locked)
        run: |
          python -m venv .venv
          ${{ runner.os == 'Windows' && '.\.venv\Scripts\python.exe' || './.venv/bin/python' }} -m pip install --no-deps --require-hashes -r requirements-dev.lock
          ${{ runner.os == 'Windows' && '.\.venv\Scripts\python.exe' || './.venv/bin/python' }} -m pip install --no-deps --no-build-isolation .
      - name: CLI smoke test
        run: |
          ${{ runner.os == 'Windows' && '.\.venv\Scripts\hostguard.exe' || './.venv/bin/hostguard' }} --no-color info
      # Real (not mocked) inventory and audit on the runner. Exit code 1 means
      # "findings" and is expected on a CI machine; 2 (error) fails the job.
      - name: Live inventory and audit smoke test
        shell: pwsh
        run: |
          $hg = if ($IsWindows) { '.\.venv\Scripts\hostguard.exe' } else { './.venv/bin/hostguard' }
          & $hg --no-color inventory --json inventory.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $hg --no-color -v audit --json audit.json
          if ($LASTEXITCODE -gt 1) { exit 1 }
          $a = Get-Content audit.json -Raw | ConvertFrom-Json
          $a.checks | Format-Table id,status,severity,detail -AutoSize -Wrap
          $errors = @($a.checks | Where-Object { $_.status -eq 'error' })
          if ($errors.Count -gt 0) { Write-Error "audit checks errored: $($errors.id -join ', ')"; exit 1 }
          exit 0
      # Malware scanner with the real third-party rule sets: in-memory EICAR self-test,
      # then a false-positive check on hostguard's source plus genuine system binaries
      # (Windows: Microsoft-signed System32 programs and drivers). Any Malicious verdict fails.
      - name: Scan self-test and false-positive check (real rules)
        shell: pwsh
        env:
          HOSTGUARD_HOME: ${{ runner.temp }}/hg
        run: |
          $hg = if ($IsWindows) { '.\.venv\Scripts\hostguard.exe' } else { './.venv/bin/hostguard' }
          $rules = Join-Path $env:HOSTGUARD_HOME 'data/rules'
          New-Item -ItemType Directory -Force $rules | Out-Null
          git clone -q --depth 1 https://github.com/reversinglabs/reversinglabs-yara-rules (Join-Path $env:RUNNER_TEMP 'rl')
          git clone -q --depth 1 https://github.com/Neo23x0/signature-base (Join-Path $env:RUNNER_TEMP 'sb')
          Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'rl/yara') (Join-Path $rules 'reversinglabs')
          Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'sb/yara') (Join-Path $rules 'signature-base')
          & $hg --no-color scan --selftest
          if ($LASTEXITCODE -ne 0) { Write-Error 'self-test failed'; exit 1 }
          if ($IsWindows) {
            $targets = @('src', 'C:\Windows\System32\WindowsPowerShell\v1.0', 'C:\Windows\System32\drivers', 'C:\Windows\explorer.exe', 'C:\Windows\System32\notepad.exe', 'C:\Windows\System32\cmd.exe')
          } else {
            $targets = @('src', '/usr/bin')
          }
          & $hg --no-color -v scan @targets --json scan.json
          if ($LASTEXITCODE -gt 1) { Write-Error 'scan error'; exit 1 }
          $s = Get-Content scan.json -Raw | ConvertFrom-Json
          "files: $($s.summary.stats.files_scanned)  malicious: $($s.summary.malicious)  suspicious: $($s.summary.suspicious)"
          if ($s.summary.malicious -gt 0) { Write-Error 'false positive: Malicious verdict on a clean system file'; exit 1 }
          exit 0
      - name: Tests
        run: ${{ runner.os == 'Windows' && '.\.venv\Scripts\python.exe' || './.venv/bin/python' }} -m pytest -ra
      - name: Lint and types
        run: |
          ${{ runner.os == 'Windows' && '.\.venv\Scripts\python.exe' || './.venv/bin/python' }} -m ruff check .
          ${{ runner.os == 'Windows' && '.\.venv\Scripts\python.exe' || './.venv/bin/python' }} -m ruff format --check .
          ${{ runner.os == 'Windows' && '.\.venv\Scripts\python.exe' || './.venv/bin/python' }} -m mypy
