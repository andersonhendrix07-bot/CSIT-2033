[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hostguard"
version = "0.1.0"
description = "Local-only host vulnerability analysis and malware scanning (complements built-in AV)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "hostguard contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security",
]
# Runtime dependencies are pinned exactly; uv.lock pins the full tree with hashes.
dependencies = [
    "platformdirs==4.13.0",
    "rich==15.0.0",
]

[project.optional-dependencies]
keyring = ["keyring==25.7.0"]

[project.scripts]
hostguard = "hostguard.cli:main"

[dependency-groups]
# Lets pip install hostguard itself offline-from-lock with --no-build-isolation.
build = ["hatchling==1.27.0"]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hostguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that touch the real filesystem",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["hostguard"]
