[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hostguard"
version = "0.1.0"
description = "Local-only host vulnerability analysis and malware scanning (complements built-in AV)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "hostguard contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security",
]
# Runtime dependencies are pinned exactly; uv.lock pins the full tree with hashes.
dependencies = [
    "httpx==0.28.1",
    "oletools==0.60.2",
    "platformdirs==4.13.0",
    "psutil==7.2.2",
    "rich==15.0.0",
    "yara-x==1.21.0",
]

[project.optional-dependencies]
keyring = ["keyring==25.7.0"]

[project.scripts]
hostguard = "hostguard.cli:main"

[dependency-groups]
# Lets pip install hostguard itself offline-from-lock with --no-build-isolation.
build = ["hatchling==1.27.0"]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "types-psutil==7.2.2.20260906",
]

[tool.uv]
# oletools declares two dependencies hostguard never uses: pcodedmp (GPL; only imported for
# P-code disassembly) and msoffcrypto-tool (only for decrypting Office files; pulls in
# `cryptography`). olevba imports both lazily, so they are excluded from the lock.
override-dependencies = [
    "pcodedmp; sys_platform == 'never'",
    "msoffcrypto-tool; sys_platform == 'never'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hostguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# oletools 0.60.2 uses pyparsing APIs that newer pyparsing marks deprecated (harmless).
filterwarnings = ["ignore::DeprecationWarning:oletools.*"]
markers = [
    "integration: end-to-end tests that touch the real filesystem",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]
# Line length is enforced by `ruff format`; E501 would only flag long user-facing strings.
# PTH100: os.path.abspath is deliberate - Path.resolve() would follow symlinks, which the
#         scanner must not do. PTH123: plain open() on str paths (incl. \\?\ long paths) is fine.
ignore = ["E501", "PTH100", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S603", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["hostguard"]

[[tool.mypy.overrides]]
module = ["oletools.*"]
ignore_missing_imports = true
